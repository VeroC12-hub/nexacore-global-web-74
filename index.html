    <!-- Domain enforcement script -->
    <script>
      // Ensure proper domain redirection
      (function() {
        if (typeof window !== 'undefined' && window.location) {
          const currentDomain = window.location.hostname;
          const targetDomain = 'www.nexacore-innovations.com';
          
          // Only redirect in production (not localhost)
          if (currentDomain !== 'localhost' && currentDomain !== '127.0.0.1') {
            if (currentDomain !== targetDomain) {
              const targetUrl = 'https://' + targetDomain + window.location.pathname + window.location.search;
              console.log('🔄 Redirecting to canonical domain:', targetUrl);
              window.location.replace(targetUrl);
            }
          }
        }
      })();
